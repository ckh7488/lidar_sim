<fieldset id="motion-controls" class="controls" hidden><legend>입자 운동 · 먼지 형태 다양화 v15</legend>
<label>오른쪽 표시 <select id="motion-view"><option value="lidar" selected>라이다 관측점</option><option value="world">공간 속 입자 · 운동 확인</option></select></label>
<button id="motion-play" type="button">연속 재생</button><button id="motion-step" type="button">0.25초 진행</button>
<label>발생 후 시간 <input id="motion-time" type="range" min="0" max="8" step=".25" value="3"><output id="motion-time-out">3</output>s</label>
<label>풍속 <input id="motionWind" type="range" min="0" max="3" step=".1" value="1"><output id="motionWind-out">1</output>m/s</label>
<label>바람 방향 <input id="motionAngle" type="range" min="0" max="360" step="5" value="35"><output id="motionAngle-out">35</output>°</label>
<span class="controls" id="motion-rain"><label>강우량 가정 <input id="rainRate" type="range" min="1" max="20" step="1" value="5"><output id="rainRate-out">5</output>mm/h</label></span>
<span class="controls" id="motion-snow"><label>눈 수 농도 가정 <input id="snowN" type="range" min="0" max="10" step=".5" value="3"><output id="snowN-out">3</output>개/m³</label></span>
<span class="controls" id="motion-dust">
<label>회오리 세기 <input id="motionEddy" type="range" min="0" max="1.5" step=".05" value=".7"><output id="motionEddy-out">.7</output></label>
<label>먼지 발생량 가정 <input id="dustFlux" type="range" min="0" max="2" step=".05" value=".20"><output id="dustFlux-out">.20</output>g/s</label>
<label>대표 입경 <input id="dustSize" type="range" min="5" max="25" step="1" value="15"><output id="dustSize-out">15</output>µm</label>
<label>발생 위치 X <input id="motionX" type="number" min="-95" max="95" value="5" step=".5"></label><label>Y <input id="motionY" type="number" min="-95" max="95" value="0" step=".5"></label>
</span>
<p id="dust-shape-note" class="muted" hidden>먼지 발생량 기본값을 0.25 → 0.20g/s로 20% 낮췄습니다. 화면 입자도 발생량에 연동해 성기게 표시합니다. 새 시드나 장소를 고르면 발생원의 길이·폭·굴곡과 상승 흐름이 달라집니다. 같은 장소·시드에서는 같은 모양으로 재현합니다. 실측에서 추정한 분포는 아닙니다.</p><button id="dust-random-location" type="button">먼지 발생 위치 새로</button><p id="motion-note" class="muted"></p><p class="muted">재생: 계산이 끝날 때마다 모의 시간 0.25초 진행. 비·눈의 운동 화면은 별도의 고정 수 시각 표본이며, 라이다 관측의 개별 반환과 1:1 대응하지 않습니다.</p><p id="motion-stats"></p>
</fieldset>
