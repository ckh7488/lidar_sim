</style><main><a href="measured_patch_review_v1.html?revision=18&amp;kind=dust&amp;view=world">← 시뮬레이터</a><h1>추가한 현장 에셋</h1><p>공개 모델 21종 · 공사장·야드·단지 9예시에 114개 추가 배치. 시뮬레이터에서도 같은 형상으로 광선 교차를 계산합니다.</p><div class="bar"><select id="model" aria-label="에셋 선택"></select><button id="previous">이전</button><button id="next">다음</button><label><input type="checkbox" id="wire">면 구조</label><button id="reset">시점 초기화</button></div><div id="viewer"></div><p id="meta"></p><div id="catalog"></div><p>크기는 장면에 맞춰 조정한 가정값입니다. 간략화된 게임용 형상이므로 실제 장비·반사율·센서 성능의 검증 자료는 아닙니다. 기존 크레인·굴착기·지게차 등은 유지합니다.</p></main><script>__THREE__</script><script id="models" type="application/json">__MODELS__</script><script>
const models=JSON.parse(document.getElementById('models').textContent),$=id=>document.getElementById(id),host=$('viewer'),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x101e29);host.append(renderer.domElement);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.01,1000);camera.up.set(0,0,1);scene.add(new THREE.HemisphereLight(0xcbe5ff,0x465045,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(8,-10,20);scene.add(light);const grid=new THREE.GridHelper(30,30,0x50726c,0x293f48);grid.rotation.x=Math.PI/2;scene.add(grid);let mesh,az=.8,el=.4,radius=10,target=new THREE.Vector3(),ticket=0;
function draw(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();camera.position.set(target.x+radius*Math.cos(el)*Math.cos(az),target.y+radius*Math.cos(el)*Math.sin(az),target.z+radius*Math.sin(el));camera.lookAt(target);renderer.render(scene,camera)}
new ResizeObserver(draw).observe(host);let drag=null;host.onpointerdown=e=>{drag=[e.clientX,e.clientY];host.setPointerCapture(e.pointerId)};host.onpointerup=host.onpointercancel=()=>drag=null;host.onpointermove=e=>{if(!drag)return;az-=(e.clientX-drag[0])*.008;el=Math.max(-.1,Math.min(1.4,el+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};host.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(.6,Math.min(100,radius*Math.exp(e.deltaY*.001)));draw()},{passive:false});
async function unzip(s,T){const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return new T(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}
function reset(){if(!mesh)return;mesh.geometry.computeBoundingBox();const box=mesh.geometry.boundingBox;box.getCenter(target);radius=box.getSize(new THREE.Vector3()).length()*1.65;az=.8;el=.35;draw()}
async function select(i){const t=++ticket,m=models[i];$('model').value=String(i);host.dataset.ready='false';const [v,f,c]=await Promise.all([unzip(m.vertices,Float32Array),unzip(m.faces,Uint32Array),unzip(m.colors,Uint8Array)]);if(t!==ticket)return;if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose()}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(v,3));g.setAttribute('color',new THREE.BufferAttribute(c,3,true));g.setIndex(new THREE.BufferAttribute(f,1));g.computeVertexNormals();mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.8,side:THREE.DoubleSide,wireframe:$('wire').checked}));scene.add(mesh);$('meta').replaceChildren(document.createTextNode(m.label+' · '+m.name+' · 폭/깊이/높이 '+m.dimensions_m.map(x=>x.toFixed(2)).join(' / ')+'m · '));const a=document.createElement('a');a.href=m.url;a.textContent='Kenney CC0 · 출처';$('meta').append(a);document.querySelectorAll('#catalog button').forEach((b,k)=>b.classList.toggle('active',k===i));host.dataset.ready='true';host.dataset.model=m.id;host.dataset.triangles=String(m.nf);reset()}
models.forEach((m,i)=>{$('model').add(new Option(m.label+' · '+m.name,String(i)));const b=document.createElement('button');b.textContent=m.name;b.onclick=()=>select(i);$('catalog').append(b)});$('model').onchange=()=>select(+$('model').value);$('previous').onclick=()=>select((+$('model').value+models.length-1)%models.length);$('next').onclick=()=>select((+$('model').value+1)%models.length);$('wire').onchange=()=>{if(mesh){mesh.material.wireframe=$('wire').checked;draw()}};$('reset').onclick=reset;select(0);
</script></html>
